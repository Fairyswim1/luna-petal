<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루나 페탈 — 달빛으로 엮는 꽃</title><link rel="icon" href="assets/reward.png"><link rel="stylesheet" href="theme/fonts.css"><link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tutorial.css"><link rel="stylesheet" href="music.css"></head><body><header><div><a class="home" href="https://math-game-arcade.vercel.app/">수학 아틀리에 ↗</a><h1>루나 페탈</h1><span>달빛으로 엮는 꽃 · 중학교 1학년</span></div><nav><button id="tutorial-replay">처음 안내</button><button id="sound">효과음 켜기</button><button id="sound-test">소리 확인</button></nav></header><p id="sound-status" role="status" hidden></p><main><div class="intro"><p>조각을 골라 <strong>360° 꽃과 목표 넓이</strong>를 완성하세요.</p><nav id="rounds" aria-label="라운드 선택"></nav></div><div class="layout"><section class="workshop panel"><div class="stage"><div><small id="chapter"></small><h2 id="title"></h2></div><span id="phase"></span></div><div id="goals"></div><div id="flower"></div><p id="message" role="status"></p><p id="lesson"></p><div class="actions"><button id="undo">한 조각 빼기</button><button id="reset">다시 시작</button><button id="seal">꽃 피우기</button><button id="next" hidden>다음 꽃 →</button></div></section><section class="tray panel"><h2>달빛 조각</h2><p class="short">누르면 꽃에 더해져요. 여분은 남겨도 돼요.</p><div id="cards"></div><details><summary>넓이와 금실 계산</summary><div id="formula"></div><p>금실은 둥근 <strong>호 부분</strong>에만 둘러요. 반지름 두 변은 금실에 포함하지 않아요. 각 조각의 호 길이를 더한 값이며, 꽃 전체의 둘레와는 달라요.</p></details></section></div><section class="collection panel"><img src="assets/guide.png" alt="달빛 토끼 공예가"><div><h2 id="collection-title"></h2><p id="progress"></p><div id="rewards"></div><a href="assessment/">내가 알아낸 것 ↗</a></div></section></main><footer>시간 제한은 없어요. 더할 조각을 천천히 골라 보세요.</footer><script type="module" src="app.mjs"></script><script type="module" src="music.mjs"></script></body></html>
